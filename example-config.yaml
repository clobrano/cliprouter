# Example Clipboard Router Configuration
# Copy this file to your config directory and customize it
#
# Linux: ~/.config/cliprouter/config.yaml
# macOS: ~/Library/Application Support/cliprouter/config.yaml

scripts:
  # Example 1: Simple echo command
  - name: Echo Clipboard
    command: echo ${CLIP}

  # Example 2: Save to daily notes with timestamp
  - name: Save to Notes
    command: |
      echo "$(date): ${CLIP}" >> ~/cliprouter-notes.txt

  # Example 3: Open URL in browser
  - name: Open in Browser
    command: xdg-open ${CLIP}

  # Example 4: Search Google (macOS example)
  # - name: Search Google
  #   command: open "https://www.google.com/search?q=${CLIP}"

  # Example 5: Copy to another file
  # - name: Append to TODO
  #   command: |
  #     echo "- [ ] ${CLIP}" >> ~/todo.md

  # Example 6: Send to API with custom timeout
  # - name: Post to Webhook
  #   timeout: 60  # Custom timeout in seconds (optional)
  #   command: |
  #     curl -X POST https://example.com/webhook \
  #       -H "Content-Type: application/json" \
  #       -d "{\"text\": ${CLIP}}"

  # Example 7: Long-running process with extended timeout
  # - name: Process Video
  #   timeout: 300  # 5 minutes timeout
  #   command: ffmpeg -i ${CLIP} -c:v libx264 output.mp4

  # Example 8: Long-running task with notifications
  # - name: Backup Files
  #   timeout: 0  # No timeout
  #   notify_before:
  #     message: "Starting backup..."
  #   notify_after:
  #     message: "Backup finished with exit code ${EXIT_CODE}"
  #   command: |
  #     tar -czf backup-$(date +%Y%m%d).tar.gz ~/Documents

  # Example 9: Notification with environment variables
  # - name: Deploy Application
  #   notify_before:
  #     message: "Deploying to ${DEPLOY_ENV} environment"
  #   notify_after:
  #     message: "Deploy to ${DEPLOY_ENV} completed successfully"
  #   notify_on_error:
  #     message: "Deploy to ${DEPLOY_ENV} failed: ${ERROR}"
  #   command: |
  #     ./deploy.sh ${CLIP}

  # Example 10: Separate notifications for success and error
  # - name: Backup Files
  #   notify_before:
  #     message: "Starting backup..."
  #   notify_after:
  #     message: "Backup completed successfully"
  #   notify_on_error:
  #     message: "Backup failed: ${ERROR}"
  #   command: |
  #     rsync -av ${CLIP} /backup/

  # Example 11: Simple notification (message only)
  # - name: Quick Task
  #   notify_after:
  #     message: "Task completed successfully"
  #   command: echo "Task done"

  # Example 12: Using command output in notifications
  # NOTE: Env vars exported INSIDE the command are NOT accessible in notifications
  # Workaround: Echo the value and use ${STDOUT}
  # - name: Process with Output
  #   notify_after:
  #     message: "Result: ${STDOUT}"
  #   command: |
  #     export RESULT="processed data"
  #     echo "$RESULT"

# Notes:
# - ${CLIP} is replaced with clipboard content (properly escaped)
# - Commands can be multiline (use | for multiline YAML)
# - Both 'name' and 'command' fields are required
# - 'timeout' is optional (in seconds). If not specified, uses the global
#   --timeout flag (default: 3 seconds)
#
# Notifications:
# - Notification title is always the script name
# - Only the message field supports variable substitution
# - Three notification types available:
#   - notify_before: Sent before command execution starts
#   - notify_after: Sent when command completes successfully (exit code 0)
#   - notify_on_error: Sent when command fails (exit code != 0)
# - Available variables in notification messages:
#   - ${SCRIPT_NAME} - name of the script being executed
#   - ${COMMAND} - the command being executed
#   - ${EXIT_CODE} - exit code of the command (available in notify_after/notify_on_error)
#   - ${STDOUT} - standard output from the command (available in notify_after/notify_on_error)
#   - ${STDERR} - standard error from the command (available in notify_after/notify_on_error)
#   - ${ERROR} - error message if any (available in notify_after/notify_on_error)
#   - ${ANY_ENV_VAR} - any environment variable (e.g., ${USER}, ${HOME})
#
# IMPORTANT: Environment variable scope
# - Only environment variables from the PARENT process are accessible
# - Variables exported INSIDE the command (e.g., 'export MYVAR=value') are NOT accessible
# - This is due to process isolation - child process env vars don't propagate to parent
# - Workaround: Use ${STDOUT} to capture command output, or set env vars before running cliprouter
