# Notes:
# - ${CLIP} is replaced with clipboard content (properly escaped)
# - Commands can be multiline (use | for multiline YAML)
# - Both 'name' and 'command' fields are required
# - 'timeout' is optional (in seconds). If not specified, uses the global
#   --timeout flag (default: 3 seconds)
#
# Notifications:
# - Notification title is always the script name
# - Message supports variable substitution
# - Three notification types available:
#   - notify_before: "message" - Sent before command execution starts
#   - notify_after: "message" - Sent when command completes successfully (exit code 0)
#   - notify_on_error: "message" - Sent when command fails (exit code != 0)
# - Available variables in notification messages:
#   - ${SCRIPT_NAME} - name of the script being executed
#   - ${COMMAND} - the command being executed
#   - ${EXIT_CODE} - exit code of the command (available in notify_after/notify_on_error)
#   - ${STDOUT} - standard output from the command (available in notify_after/notify_on_error)
#   - ${STDERR} - standard error from the command (available in notify_after/notify_on_error)
#   - ${ERROR} - error message if any (available in notify_after/notify_on_error)
#   - ${ANY_ENV_VAR} - any environment variable (e.g., ${USER}, ${HOME})
#
# Environment Variables:
# - Parent process environment variables are accessible in notifications
# - Example: ${USER}, ${HOME}, ${PATH}
#
# Dynamic Environment Variables (CLIPROUTER_ENV_FILE):
# - Commands receive a $CLIPROUTER_ENV_FILE variable pointing to a temp file
# - Write "VAR_NAME=value" lines to this file to expose vars to notifications
# - Format: One variable per line, e.g., "REPORT_FILE=/path/to/file"
# - Useful when values are computed during execution
# - Example: echo "MYVAR=$computed_value" >> "$CLIPROUTER_ENV_FILE"
#
# IMPORTANT: Variables exported INSIDE the command (e.g., 'export MYVAR=value')
# are NOT accessible in notifications due to process isolation.
# Use CLIPROUTER_ENV_FILE to make variables available to notifications.
#
# Interactive Notifications (notify_action):
# - Shows a dialog with Yes/No buttons after command completes successfully
# - Executes an action when user clicks Yes (opens file or runs command)
# - Configuration structure:
#   notify_action:
#     prompt: "message"       # Message to show in dialog (supports variable substitution)
#     on_confirm:             # Action to perform when user clicks Yes
#       open_file: "path"     # Opens file/directory with default application (xdg-open/open/start)
#       execute: "command"    # Executes a command in the background
#
# - Only one action can be specified (either open_file OR execute, not both)
# - Both prompt and action support full variable substitution
# - Interactive notifications only show on successful command execution (exit code 0)
# - Available on all platforms:
#   - Linux: Uses zenity or kdialog for dialogs, xdg-open for files
#   - macOS: Uses AppleScript for dialogs, open for files
#   - Windows: Uses PowerShell MessageBox for dialogs, Start-Process for files
# - Actions run in the background and don't block the application
#
# Example use cases:
# - Open backup directory after creating backup
# - Open generated report/document after conversion
# - View logs after deployment
# - Run tests after build completes
# - Open project directory after cloning repository
